<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="asFilter">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Main Dashboard View -->
  <rect x="100" y="50" width="400" height="320" rx="20" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#asFilter)"/>
  <rect x="130" y="80" width="160" height="16" rx="8" fill="#FF7A50"/>
  <text x="130" y="125" font-family="Arial" font-size="18" font-weight="bold" fill="#20243A">Adaptive AI Assessment</text>
  
  <!-- Score gauge circle -->
  <circle cx="200" cy="220" r="55" fill="none" stroke="#F1F5F9" stroke-width="12"/>
  <circle cx="200" cy="220" r="55" fill="none" stroke="#FF7A50" stroke-width="12" stroke-dasharray="280" stroke-dashoffset="60" stroke-linecap="round"/>
  <text x="200" y="215" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#20243A">94%</text>
  <text x="200" y="235" font-family="Arial" font-size="11" text-anchor="middle" fill="#64748B">Accuracy</text>
  
  <!-- Stat bars -->
  <rect x="290" y="170" width="170" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="290" y="170" width="140" height="10" rx="5" fill="#3B82F6"/>
  <text x="290" y="160" font-family="Arial" font-size="12" fill="#64748B">Concept Mastery (88%)</text>
  
  <rect x="290" y="220" width="170" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="290" y="220" width="160" height="10" rx="5" fill="#10B981"/>
  <text x="290" y="210" font-family="Arial" font-size="12" fill="#64748B">Speed & Retention (96%)</text>
  
  <rect x="290" y="270" width="170" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="290" y="270" width="125" height="10" rx="5" fill="#F59E0B"/>
  <text x="290" y="260" font-family="Arial" font-size="12" fill="#64748B">Exam Readiness (75%)</text>
</svg>
