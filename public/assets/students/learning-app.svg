<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#FFEFEA"/>
    </linearGradient>
  </defs>
  <!-- Phone Frame -->
  <rect x="180" y="30" width="240" height="390" rx="36" fill="url(#phoneGrad)" />
  <rect x="190" y="42" width="220" height="366" rx="28" fill="url(#screenGrad)" />
  
  <!-- Notch -->
  <rect x="255" y="48" width="90" height="12" rx="6" fill="#1A202C"/>
  
  <!-- UI Card 1 -->
  <rect x="205" y="75" width="190" height="90" rx="16" fill="#FF7A50"/>
  <text x="220" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="white">Physics Grade 10</text>
  <text x="220" y="125" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.85)">Chapter 4: Thermodynamics</text>
  <rect x="220" y="138" width="160" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="220" y="138" width="120" height="6" rx="3" fill="white"/>

  <!-- UI Card 2 -->
  <rect x="205" y="180" width="190" height="60" rx="14" fill="white"/>
  <circle cx="230" cy="210" r="14" fill="#E8F8F0"/>
  <text x="230" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#00B074">✓</text>
  <text x="255" y="206" font-family="Arial" font-size="12" font-weight="bold" fill="#20243A">Daily Challenge Completed</text>
  <text x="255" y="222" font-family="Arial" font-size="10" fill="#707383">+50 XP Earned today</text>

  <!-- UI Card 3 -->
  <rect x="205" y="255" width="190" height="60" rx="14" fill="white"/>
  <circle cx="230" cy="285" r="14" fill="#EEF7FF"/>
  <text x="230" y="290" font-family="Arial" font-size="12" text-anchor="middle" fill="#3B82F6">⚡</text>
  <text x="255" y="281" font-family="Arial" font-size="12" font-weight="bold" fill="#20243A">Live Doubt Solving</text>
  <text x="255" y="297" font-family="Arial" font-size="10" fill="#707383">Mentor online in 2 mins</text>
