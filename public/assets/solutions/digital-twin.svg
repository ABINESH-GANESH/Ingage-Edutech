<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="dtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="#0A0F1D"/>
  <!-- Twin Nodes connected -->
  <circle cx="120" cy="150" r="36" fill="#1E293B" stroke="#00F2FE" stroke-width="2.5"/>
  <text x="120" y="156" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00F2FE">PHYSICAL</text>
  
  <line x1="160" y1="150" x2="240" y2="150" stroke="url(#dtGrad)" stroke-width="3" stroke-dasharray="6 4"/>
  
  <circle cx="280" cy="150" r="36" fill="#1E293B" stroke="#B721FF" stroke-width="2.5"/>
  <text x="280" y="156" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#B721FF">DIGITAL</text>
  
  <text x="200" y="240" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#38BDF8">REAL-TIME DIGITAL TWIN</text>
</svg>
