<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B721FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>
  </defs>
  <!-- InGage Geometric Hex Icon -->
  <g transform="translate(10, 8)">
    <polygon points="22,2 40,12 40,32 22,42 4,32 4,12" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="22,10 32,16 32,28 22,34 12,28 12,16" fill="url(#gGrad)" fill-opacity="0.25" stroke="#00F2FE" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="4" fill="#00F2FE"/>
  </g>
  
  <!-- Typography -->
  <text x="62" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    In<tspan fill="url(#logoGrad)">Gage</tspan>
  </text>
  <text x="63" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="2.5">
    IMMERSIVE TECH & EDUTECH
  </text>
</svg>
