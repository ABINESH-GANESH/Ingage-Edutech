<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A50"/>
      <stop offset="100%" stop-color="#E05322"/>
    </linearGradient>
    <filter id="tShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="300" cy="250" r="180" fill="#FFF2EC" />
  <circle cx="300" cy="250" r="140" fill="#FFE3D4" />
  
  <!-- Teacher presentation board -->
  <rect x="140" y="100" width="320" height="220" rx="16" fill="white" stroke="#E2E8F0" stroke-width="3" filter="url(#tShadow)"/>
  <rect x="170" y="130" width="140" height="12" rx="6" fill="#FF7A50"/>
  <rect x="170" y="155" width="260" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="170" y="175" width="200" height="8" rx="4" fill="#E2E8F0"/>
  
  <!-- Interactive Analytics inside board -->
  <path d="M170 270 Q 230 220, 290 240 T 410 190" fill="none" stroke="#FF7A50" stroke-width="4" stroke-linecap="round"/>
  <circle cx="410" cy="190" r="6" fill="#FF7A50" />
  
  <!-- Teacher Avatar Representation -->
  <g transform="translate(320, 180)" filter="url(#tShadow)">
    <circle cx="80" cy="60" r="38" fill="#FFDFC6"/>
    <path d="M45 45 C45 25 115 25 115 45 C115 50 110 65 80 65 C50 65 45 50 45 45 Z" fill="#2D3748"/>
    <!-- Glasses -->
    <rect x="62" y="52" width="14" height="10" rx="3" fill="none" stroke="#2D3748" stroke-width="2"/>
    <rect x="84" y="52" width="14" height="10" rx="3" fill="none" stroke="#2D3748" stroke-width="2"/>
    <line x1="76" y1="57" x2="84" y2="57" stroke="#2D3748" stroke-width="2"/>
    <!-- Body / Blazer -->
    <path d="M30 140 C30 100 130 100 130 140 Z" fill="url(#tGrad)"/>
    <polygon points="80,105 70,140 90,140" fill="white"/>
  </g>
  
  <!-- Lesson Plan badge -->
  <g transform="translate(100, 310)" filter="url(#tShadow)">
    <rect width="180" height="60" rx="14" fill="white" stroke="#FFDAC9" stroke-width="2"/>
    <text x="20" y="26" font-family="Arial" font-size="12" font-weight="bold" fill="#20243A">Automated Grading</text>
    <text x="20" y="44" font-family="Arial" font-size="11" fill="#00B074">✓ Save 10+ hrs / week</text>
  </g>
</svg>
